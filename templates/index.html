<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PyMessenger</title>
<meta name="theme-color" content="#3390EC">
<style>
:root {
    --bg: #E7EBF0;
    --surface: #FFFFFF;
    --surface-2: #F4F4F5;
    --text: #0F0F0F;
    --text-2: #707579;
    --border: #DAE1E4;
    --my-bubble: #EFFDDE;
    --my-bubble-grad: linear-gradient(135deg, #E3F7D0 0%, #EFFDDE 100%);
    --my-text: #0F0F0F;
    --other-bubble: #FFFFFF;
    --accent: #3390EC;
    --accent-hover: #1E88E5;
    --danger: #E53935;
    --success: #43A047;
    --shadow: 0 1px 2px rgba(0,0,0,0.08);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
}
body.dark {
    --bg: #0F0F0F;
    --surface: #181818;
    --surface-2: #202020;
    --text: #F4F4F5;
    --text-2: #A0A0A0;
    --border: #262626;
    --my-bubble: #766AC8;
    --my-bubble-grad: linear-gradient(135deg, #877ACE 0%, #766AC8 100%);
    --my-text: #FFFFFF;
    --other-bubble: #1E1E1E;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.4s ease, color 0.4s ease;
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

/* ===== AUTH SCREEN ===== */
.auth-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000;
    animation: fadeIn 0.5s ease-out;
}
.auth-card {
    background: var(--surface);
    border-radius: 24px;
    padding: 40px 32px;
    width: min(90%, 400px);
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes slideUp {
    from { opacity: 0; transform: translateY(40px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.auth-logo {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, var(--accent), #766AC8);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2em; margin: 0 auto 24px;
    animation: logoSpin 1s ease-out;
    box-shadow: 0 8px 24px rgba(51,144,236,0.3);
}
@keyframes logoSpin {
    from { transform: scale(0) rotate(-180deg); }
    to { transform: scale(1) rotate(0deg); }
}
.auth-card h1 {
    text-align: center; font-size: 1.8em; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), #766AC8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
}
.auth-card p { text-align: center; color: var(--text-2); margin-bottom: 24px; font-size: 0.9em; }
.auth-input {
    width: 100%; padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 1em;
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.3s, box-shadow 0.3s;
}
.auth-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(51,144,236,0.15);
}
.auth-btn {
    width: 100%; padding: 14px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #766AC8);
    color: white; font-size: 1.05em; font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    margin-bottom: 12px;
}
.auth-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(51,144,236,0.35); }
.auth-btn:active { transform: translateY(0); }
.auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.auth-switch {
    text-align: center; color: var(--text-2); font-size: 0.9em;
}
.auth-switch a {
    color: var(--accent); text-decoration: none; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s;
}
.auth-switch a:hover { opacity: 0.8; }
.auth-error {
    background: rgba(229,57,53,0.1);
    color: var(--danger);
    padding: 10px 16px; border-radius: 12px;
    font-size: 0.85em; margin-bottom: 16px;
    text-align: center;
    animation: shake 0.4s;
    display: none;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}
.auth-success {
    background: rgba(67,160,71,0.1);
    color: var(--success);
    padding: 10px 16px; border-radius: 12px;
    font-size: 0.85em; margin-bottom: 16px;
    text-align: center;
    animation: fadeIn 0.3s;
    display: none;
}

/* ===== CHAT ===== */
.chat-app {
    display: none;
    flex-direction: column;
    height: 100%;
    animation: fadeIn 0.5s ease-out;
}
.chat-app.visible { display: flex; }

/* HEADER */
.header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    z-index: 10;
}
.header h1 {
    font-size: 1.25em; font-weight: 600; flex: 1;
    background: linear-gradient(135deg, var(--accent), #766AC8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
}
.icon-btn {
    width: 38px; height: 38px; border: none; background: transparent;
    border-radius: 50%; font-size: 1.2em; cursor: pointer;
    color: var(--text); display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    transition: background 0.2s, transform 0.2s;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(0.9); }

/* PROFILE BAR */
.profile-bar {
    padding: 8px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
}
.my-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; color: var(--text-2);
    cursor: pointer; overflow: hidden;
    border: 2px solid var(--border);
    transition: border-color 0.2s, transform 0.2s;
}
.my-avatar:hover { border-color: var(--accent); transform: scale(1.05); }
.my-avatar img { width: 100%; height: 100%; object-fit: cover; }
.my-name { font-weight: 600; font-size: 0.95em; }
.logout-btn {
    margin-left: auto;
    padding: 6px 12px; border: none;
    background: var(--surface-2); color: var(--text-2);
    border-radius: 20px; font-size: 0.8em; cursor: pointer;
    transition: background 0.2s;
}
.logout-btn:hover { background: var(--border); }

/* ONLINE */
.online-bar {
    padding: 6px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    overflow-x: auto; scrollbar-width: none;
    font-size: 0.85em;
}
.online-bar::-webkit-scrollbar { display: none; }
.online-bar .label { color: var(--text-2); white-space: nowrap; }
.user-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px 4px 4px;
    background: var(--surface-2); border-radius: 20px;
    white-space: nowrap;
    animation: chipIn 0.3s ease-out;
}
.avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 600; font-size: 0.7em;
    flex-shrink: 0; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.lg { width: 40px; height: 40px; font-size: 0.85em; }
@keyframes chipIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
}

/* CHAT MESSAGES */
.chat {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 16px; display: flex; flex-direction: column; gap: 2px;
    -webkit-overflow-scrolling: touch;
    background-image:
        radial-gradient(circle at 20% 30%, rgba(51,144,236,0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(118,106,200,0.04) 0%, transparent 50%);
}
body.dark .chat {
    background-image:
        radial-gradient(circle at 20% 30%, rgba(51,144,236,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(118,106,200,0.06) 0%, transparent 50%);
}
.chat::-webkit-scrollbar { width: 6px; }
.chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.msg-row {
    display: flex; gap: 8px; max-width: 85%;
    animation: msgIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.msg-row.my { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.other { align-self: flex-start; }
.msg-row.system { align-self: center; max-width: 90%; animation: sysIn 0.4s ease-out; }
@keyframes msgIn {
    from { opacity: 0; transform: translateY(16px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes sysIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}
.bubble {
    padding: 8px 12px; border-radius: 16px;
    box-shadow: var(--shadow);
    word-wrap: break-word; word-break: break-word;
    max-width: 100%;
}
.msg-row.my .bubble {
    background: var(--my-bubble-grad);
    color: var(--my-text);
    border-bottom-right-radius: 4px;
}
.msg-row.other .bubble {
    background: var(--other-bubble);
    border-bottom-left-radius: 4px;
}
.msg-row.continued { margin-top: -4px; }
.msg-row.continued.my .bubble { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
.msg-row.continued.other .bubble { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.msg-row.continued .avatar { visibility: hidden; }
.sender { font-weight: 600; font-size: 0.85em; margin-bottom: 2px; display: block; }
.text { font-size: 0.95em; line-height: 1.35; white-space: pre-wrap; }
.meta {
    font-size: 0.7em; color: var(--text-2);
    float: right; margin-left: 10px; margin-top: 4px;
    opacity: 0.8;
}
.msg-row.my .meta { color: var(--my-text); opacity: 0.65; }
.sys-msg {
    background: var(--surface-2); color: var(--text-2);
    padding: 4px 12px; border-radius: 12px;
    font-size: 0.8em; text-align: center; font-style: italic;
}
.bubble img {
    max-width: 100%; border-radius: 12px; cursor: pointer;
    margin-top: 4px; display: block; transition: transform 0.3s;
}
.bubble img:hover { transform: scale(1.02); }
.bubble audio { max-width: 100%; margin-top: 4px; border-radius: 20px; }
.file-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; margin-top: 4px;
    background: var(--surface-2); color: var(--text);
    border-radius: 14px; text-decoration: none;
    font-size: 0.85em; font-weight: 500;
    transition: background 0.2s;
}
.file-link:hover { background: var(--border); }
.msg-row.my .file-link { background: rgba(0,0,0,0.1); color: var(--my-text); }

/* STATUS */
.status-bar {
    padding: 4px 16px; min-height: 22px;
    font-size: 0.85em; color: var(--accent);
    display: flex; align-items: center; gap: 6px;
    background: var(--surface);
    border-top: 1px solid var(--border);
}
.typing-dots { display: inline-flex; gap: 3px; }
.typing-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    animation: dotBounce 1.4s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
}
.shimmer-text {
    background: linear-gradient(90deg, var(--accent) 0%, #766AC8 50%, var(--accent) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 2s infinite linear;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* INPUT */
.input-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
#text-input {
    flex: 1; padding: 10px 16px; border: none;
    border-radius: 22px; background: var(--surface-2);
    color: var(--text); font-size: 0.95em; outline: none;
    transition: background 0.2s;
}
#text-input:focus { background: var(--border); }
.send-btn {
    width: 42px; height: 42px; border: none;
    border-radius: 50%; background: var(--accent);
    color: white; font-size: 1.2em; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg);
    transition: transform 0.2s, background 0.2s;
    position: relative; overflow: hidden;
}
.send-btn:hover { background: var(--accent-hover); }
.send-btn:active { transform: scale(0.9); }
.record-btn.recording { background: var(--danger); animation: pulse 1.2s infinite; }
@keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.5); }
    50% { box-shadow: 0 0 0 12px rgba(229,57,53,0); }
}
.ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transform: scale(0); animation: rippleAnim 0.6s linear;
    pointer-events: none;
}
@keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

/* GALLERY */
.gallery {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.95); z-index: 1000;
    justify-content: center; align-items: center;
    animation: fadeIn 0.25s ease-out;
}
.gallery.active { display: flex; }
.gallery img {
    max-width: 95%; max-height: 90vh;
    border-radius: 8px;
    animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes zoomIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.gallery-close {
    position: absolute; top: 20px; right: 20px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: none;
    color: white; font-size: 1.5em; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
}
.gallery-close:hover { background: rgba(255,255,255,0.3); }

/* AVATAR UPLOAD MODAL */
.avatar-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 1500;
    justify-content: center; align-items: center;
    animation: fadeIn 0.2s;
}
.avatar-modal.active { display: flex; }
.avatar-modal-content {
    background: var(--surface); border-radius: 20px;
    padding: 24px; text-align: center;
    animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.avatar-modal-content h3 { margin-bottom: 16px; }
.avatar-preview {
    width: 100px; height: 100px; border-radius: 50%;
    margin: 0 auto 16px; overflow: hidden;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
}
.avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
.avatar-modal-btns { display: flex; gap: 10px; justify-content: center; }
.avatar-modal-btns button {
    padding: 10px 20px; border: none; border-radius: 12px;
    cursor: pointer; font-size: 0.9em; font-weight: 600;
    transition: transform 0.2s;
}
.avatar-modal-btns button:hover { transform: translateY(-2px); }
.avatar-save { background: var(--accent); color: white; }
.avatar-cancel { background: var(--surface-2); color: var(--text); }

@media (max-width: 500px) {
    .msg-row { max-width: 92%; }
    .header h1 { font-size: 1.1em; }
    .auth-card { padding: 32px 20px; }
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-screen" id="auth-screen">
    <div class="auth-card">
        <div class="auth-logo">💬</div>
        <h1>PyMessenger</h1>
        <p id="auth-subtitle">Войдите в свой аккаунт</p>
        <div class="auth-error" id="auth-error"></div>
        <div class="auth-success" id="auth-success"></div>
        <input type="text" class="auth-input" id="auth-username" placeholder="Ник" autocomplete="username" maxlength="30">
        <input type="password" class="auth-input" id="auth-password" placeholder="Пароль" autocomplete="current-password">
        <button class="auth-btn" id="auth-submit" onclick="submitAuth()">Войти</button>
        <div class="auth-switch" id="auth-switch">
            Нет аккаунта? <a onclick="switchAuthMode()">Зарегистрироваться</a>
        </div>
    </div>
</div>

<!-- CHAT APP -->
<div class="chat-app" id="chat-app">
    <div class="header">
        <h1>PyMessenger</h1>
        <button class="icon-btn" id="theme-btn" title="Тема">🌙</button>
    </div>

    <div class="profile-bar">
        <div class="my-avatar" id="my-avatar" onclick="openAvatarModal()">
            <span id="my-avatar-text">?</span>
        </div>
        <span class="my-name" id="my-name">Гость</span>
        <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>

    <div class="online-bar">
        <span class="label">Онлайн:</span>
        <span id="online-users"></span>
    </div>

    <div class="chat" id="chat"></div>
    <div class="status-bar" id="status-bar"></div>

    <div class="input-bar">
        <input type="text" id="text-input" placeholder="Сообщение..." maxlength="2000" autocomplete="off">
        <button class="icon-btn" onclick="document.getElementById('img-in').click()" title="Фото">🖼️</button>
        <button class="icon-btn" onclick="document.getElementById('file-in').click()" title="Файл">📎</button>
        <button class="icon-btn record-btn" id="record-btn" title="Голосовое">🎤</button>
        <button class="send-btn" id="send-btn" title="Отправить">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <input type="file" id="img-in" accept="image/*" multiple hidden>
        <input type="file" id="file-in" hidden>
    </div>
</div>

<!-- GALLERY -->
<div class="gallery" id="gallery">
    <button class="gallery-close" id="gallery-close">✕</button>
    <img id="gallery-img" src="" alt="">
</div>

<!-- AVATAR MODAL -->
<div class="avatar-modal" id="avatar-modal">
    <div class="avatar-modal-content">
        <h3>Аватарка</h3>
        <div class="avatar-preview" id="avatar-preview">
            <span id="avatar-preview-text">?</span>
        </div>
        <input type="file" id="avatar-input" accept="image/*" hidden>
        <div class="avatar-modal-btns">
            <button class="avatar-save" onclick="document.getElementById('avatar-input').click()">Выбрать фото</button>
            <button class="avatar-cancel" onclick="closeAvatarModal()">Отмена</button>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io();

// ===== STATE =====
let myName = '';
let myAvatar = null;
let clientId = getClientId();
let isAuthMode = 'login'; // 'login' | 'register'
let lastSender = null;
let mediaRecorder, audioChunks = [], isRecording = false;
let typingTimer, isTyping = false;
const userAvatars = {}; // {username: avatar_b64}

function getClientId() {
    let id = localStorage.getItem('client_id');
    if (!id) {
        id = 'c_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('client_id', id);
    }
    return id;
}

// ===== DOM =====
const authScreen = document.getElementById('auth-screen');
const chatApp = document.getElementById('chat-app');
const authUsername = document.getElementById('auth-username');
const authPassword = document.getElementById('auth-password');
const authSubmit = document.getElementById('auth-submit');
const authSwitch = document.getElementById('auth-switch');
const authError = document.getElementById('auth-error');
const authSuccess = document.getElementById('auth-success');
const authSubtitle = document.getElementById('auth-subtitle');
const chat = document.getElementById('chat');
const textInput = document.getElementById('text-input');
const recordBtn = document.getElementById('record-btn');
const sendBtn = document.getElementById('send-btn');
const onlineUsers = document.getElementById('online-users');
const themeBtn = document.getElementById('theme-btn');
const statusBar = document.getElementById('status-bar');
const imgIn = document.getElementById('img-in');
const fileIn = document.getElementById('file-in');
const gallery = document.getElementById('gallery');
const galleryImg = document.getElementById('gallery-img');
const galleryClose = document.getElementById('gallery-close');
const avatarModal = document.getElementById('avatar-modal');
const avatarInput = document.getElementById('avatar-input');

// ===== AUTH =====
function switchAuthMode() {
    isAuthMode = isAuthMode === 'login' ? 'register' : 'login';
    authSubmit.textContent = isAuthMode === 'login' ? 'Войти' : 'Зарегистрироваться';
    authSubtitle.textContent = isAuthMode === 'login' ? 'Войдите в свой аккаунт' : 'Создайте новый аккаунт';
    authSwitch.innerHTML = isAuthMode === 'login'
        ? 'Нет аккаунта? <a onclick="switchAuthMode()">Зарегистрироваться</a>'
        : 'Уже есть аккаунт? <a onclick="switchAuthMode()">Войти</a>';
    authError.style.display = 'none';
    authSuccess.style.display = 'none';
    authPassword.value = '';
}

function submitAuth() {
    const username = authUsername.value.trim();
    const password = authPassword.value;
    if (!username || !password) {
        showAuthError('Заполните все поля');
        return;
    }
    authSubmit.disabled = true;
    authSubmit.textContent = 'Подождите...';

    if (isAuthMode === 'login') {
        socket.emit('login', { username, password, client_id: clientId });
    } else {
        socket.emit('register', { username, password, client_id: clientId });
    }
}

function showAuthError(msg) {
    authError.textContent = msg;
    authError.style.display = 'block';
    authSuccess.style.display = 'none';
    authSubmit.disabled = false;
    authSubmit.textContent = isAuthMode === 'login' ? 'Войти' : 'Зарегистрироваться';
}
function showAuthSuccess(msg) {
    authSuccess.textContent = msg;
    authSuccess.style.display = 'block';
    authError.style.display = 'none';
}

// Enter для отправки формы
authPassword.onkeydown = e => { if (e.key === 'Enter') submitAuth(); };
authUsername.onkeydown = e => { if (e.key === 'Enter') authPassword.focus(); };

// ===== LOGIN / REGISTER HANDLERS =====
socket.on('auth_success', d => {
    myName = d.username;
    myAvatar = d.avatar || null;
    localStorage.setItem('name', myName);

    // Переход в чат с анимацией
    authScreen.style.opacity = '0';
    authScreen.style.transform = 'scale(0.95)';
    authScreen.style.transition = 'all 0.4s ease-out';
    setTimeout(() => {
        authScreen.style.display = 'none';
        chatApp.classList.add('visible');
        updateMyProfile();
    }, 400);
});

socket.on('auth_error', d => showAuthError(d.message));
socket.on('session_expired', () => {
    // Сессия истекла — показываем форму входа
    authScreen.style.display = 'flex';
    authScreen.style.opacity = '1';
    authScreen.style.transform = 'scale(1)';
    chatApp.classList.remove('visible');
});

// Проверяем сессию при загрузке
socket.on('connect', () => {
    socket.emit('check_session', { client_id: clientId });
});

function updateMyProfile() {
    document.getElementById('my-name').textContent = myName;
    const av = document.getElementById('my-avatar');
    if (myAvatar) {
        av.innerHTML = `<img src="data:image/jpeg;base64,${myAvatar}" alt="avatar">`;
    } else {
        av.innerHTML = `<span id="my-avatar-text">${myName[0]?.toUpperCase() || '?'}</span>`;
    }
}

function logout() {
    localStorage.removeItem('client_id');
    localStorage.removeItem('name');
    location.reload();
}

// ===== AVATAR =====
function openAvatarModal() {
    avatarModal.classList.add('active');
    const preview = document.getElementById('avatar-preview');
    if (myAvatar) {
        preview.innerHTML = `<img src="data:image/jpeg;base64,${myAvatar}" alt="preview">`;
    } else {
        preview.innerHTML = `<span id="avatar-preview-text">${myName[0]?.toUpperCase() || '?'}</span>`;
    }
}
function closeAvatarModal() {
    avatarModal.classList.remove('active');
}
avatarModal.onclick = e => { if (e.target === avatarModal) closeAvatarModal(); };

avatarInput.onchange = async () => {
    const file = avatarInput.files[0];
    if (!file) return;
    avatarInput.value = '';

    try {
        const blob = await compressImage(file, 128); // маленький размер для аватарки
        const reader = new FileReader();
        reader.onload = () => {
            const b64 = reader.result.split(',')[1];
            myAvatar = b64;
            socket.emit('set_avatar', { username: myName, avatar: reader.result });
            updateMyProfile();
            const preview = document.getElementById('avatar-preview');
            preview.innerHTML = `<img src="data:image/jpeg;base64,${b64}" alt="preview">`;
        };
        reader.readAsDataURL(blob);
    } catch(e) { alert('Ошибка загрузки аватарки'); }
};

socket.on('avatar_updated', d => {
    userAvatars[d.username] = d.avatar;
    if (d.username === myName) {
        myAvatar = d.avatar;
        updateMyProfile();
    }
    // Обновляем аватарки в чате
    document.querySelectorAll(`[data-user="${CSS.escape(d.username)}"] .avatar`).forEach(av => {
        if (d.avatar) {
            av.innerHTML = `<img src="data:image/jpeg;base64,${d.avatar}" alt="avatar">`;
        }
    });
});

// ===== THEME =====
function applyTheme(t) {
    document.body.classList.toggle('dark', t === 'dark');
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', t);
    document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0F0F0F' : '#3390EC';
}
applyTheme(localStorage.getItem('theme') || 'light');
themeBtn.onclick = () => applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');

// ===== HELPERS =====
const AVATAR_COLORS = ['#3390EC','#E53935','#43A047','#FB8C00','#8E24AA','#00ACC1','#6D4C41','#546E7A','#D81B60','#3949AB'];
function avatarColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(name) {
    const p = name.trim().split(/\s+/);
    return ((p[0]?.[0] || '') + (p[1]?.[0] || '')).toUpperCase() || '?';
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(b) {
    if (b < 1024) return b + ' Б';
    if (b < 1048576) return (b/1024).toFixed(1) + ' КБ';
    return (b/1048576).toFixed(1) + ' МБ';
}
function timeNow() {
    const d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function b64toBlob(b64, mime) {
    const byteChars = atob(b64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    return new Blob([new Uint8Array(byteNumbers)], { type: mime });
}

// ===== RIPPLE =====
document.querySelectorAll('.send-btn, .icon-btn, .auth-btn').forEach(btn => {
    btn.addEventListener('click', e => {
        const r = document.createElement('span');
        r.className = 'ripple';
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        r.style.width = r.style.height = size + 'px';
        r.style.left = (e.clientX - rect.left - size/2) + 'px';
        r.style.top = (e.clientY - rect.top - size/2) + 'px';
        btn.appendChild(r);
        setTimeout(() => r.remove(), 600);
    });
});

// ===== GALLERY =====
function openGallery(src) { galleryImg.src = src; gallery.classList.add('active'); }
galleryClose.onclick = e => { e.stopPropagation(); closeGallery(); };
gallery.onclick = closeGallery;
function closeGallery() { gallery.classList.remove('active'); galleryImg.src = ''; }

// ===== MESSAGES =====
function addMsg(type, username, content, extra = {}) {
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.dataset.user = username;

    if (type === 'system') {
        row.classList.add('system');
        row.innerHTML = `<div class="sys-msg">${esc(content)}</div>`;
        chat.appendChild(row);
        scrollDown();
        return;
    }

    const isMy = username === myName;
    row.classList.add(isMy ? 'my' : 'other');
    const continued = lastSender === username;
    if (continued) row.classList.add('continued');

    const av = document.createElement('div');
    av.className = 'avatar lg';
    const userAv = userAvatars[username];
    if (userAv) {
        av.innerHTML = `<img src="data:image/jpeg;base64,${userAv}" alt="avatar">`;
    } else {
        av.style.background = avatarColor(username);
        av.textContent = initials(username);
    }
    row.appendChild(av);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (!continued && !isMy) {
        const s = document.createElement('span');
        s.className = 'sender';
        s.style.color = avatarColor(username);
        s.textContent = username;
        bubble.appendChild(s);
    }

    if (type === 'text') {
        const t = document.createElement('div');
        t.className = 'text';
        t.textContent = content;
        bubble.appendChild(t);
    } else if (type === 'voice') {
        const label = document.createElement('div');
        label.className = 'text';
        label.innerHTML = '🎤 <b>Голосовое сообщение</b>';
        bubble.appendChild(label);
        const aud = document.createElement('audio');
        aud.controls = true;
        const blob = content instanceof Blob ? content : b64toBlob(content, 'audio/webm');
        aud.src = URL.createObjectURL(blob);
        bubble.appendChild(aud);
    } else if (type === 'image') {
        const img = document.createElement('img');
        const blob = content instanceof Blob ? content : b64toBlob(content, extra.mime || 'image/jpeg');
        const url = URL.createObjectURL(blob);
        img.src = url;
        img.onclick = () => openGallery(url);
        bubble.appendChild(img);
    } else if (type === 'file') {
        const label = document.createElement('div');
        label.className = 'text';
        label.innerHTML = `📎 <b>${esc(extra.filename)}</b> <small>(${fmtSize(extra.size)})</small>`;
        bubble.appendChild(label);
        const a = document.createElement('a');
        a.className = 'file-link';
        a.href = URL.createObjectURL(b64toBlob(content, extra.mime || 'application/octet-stream'));
        a.download = extra.filename;
        a.textContent = '⬇ Скачать';
        bubble.appendChild(a);
    }

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = timeNow();
    bubble.appendChild(meta);

    row.appendChild(bubble);
    chat.appendChild(row);
    lastSender = username;
    scrollDown();
}

function scrollDown() {
    requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
}

// ===== SEND TEXT =====
function sendText() {
    const txt = textInput.value.trim();
    if (!txt) return;
    socket.emit('text_message', { username: myName, text: txt });
    textInput.value = '';
    setTyping(false);
}
sendBtn.onclick = sendText;
textInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } };
textInput.oninput = () => {
    if (textInput.value.trim() && !isTyping) setTyping(true);
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => setTyping(false), 2000);
};
function setTyping(v) {
    if (v === isTyping) return;
    isTyping = v;
    socket.emit('typing', { username: myName, typing: v });
}

// ===== IMAGES =====
function compressImage(file, maxDim = 1920) {
    return new Promise((res, rej) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url);
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
                const k = maxDim / Math.max(width, height);
                width = Math.round(width * k);
                height = Math.round(height * k);
            }
            const c = document.createElement('canvas');
            c.width = width; c.height = height;
            c.getContext('2d').drawImage(img, 0, 0, width, height);
            const tryQ = q => {
                c.toBlob(b => {
                    if (!b) return c.toBlob(x => res(x), 'image/jpeg', 0.3);
                    if (b.size <= 500*1024 || q <= 0.25) res(b);
                    else tryQ(q - 0.1);
                }, 'image/jpeg', q);
            };
            tryQ(0.75);
        };
        img.onerror = rej;
        img.src = url;
    });
}

imgIn.onchange = async () => {
    const files = Array.from(imgIn.files);
    imgIn.value = '';
    for (const f of files) {
        if (f.size > 5 * 1024 * 1024) { alert('Макс. 5 МБ для фото'); continue; }
        try {
            setStatus('Отправка фото...', true);
            const blob = await compressImage(f);
            const buf = await blob.arrayBuffer();
            socket.emit('image_message', { username: myName, image: buf, mime: blob.type });
            setStatus('');
        } catch(e) { addMsg('system', '', 'Ошибка: ' + e.message); setStatus(''); }
    }
};

// ===== FILES =====
fileIn.onchange = () => {
    const f = fileIn.files[0];
    fileIn.value = '';
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) { alert('Макс. 10 МБ'); return; }
    setStatus('Отправка файла...', true);
    socket.emit('action_status', { username: myName, action: 'sending_file' });
    const reader = new FileReader();
    reader.onload = () => {
        socket.emit('file_message', {
            username: myName, filename: f.name,
            file_data: reader.result, mime: f.type || 'application/octet-stream',
            size: f.size
        });
        setStatus('');
    };
    reader.readAsArrayBuffer(f);
};

// ===== VOICE =====
recordBtn.onclick = async () => {
    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                stream.getTracks().forEach(t => t.stop());
                blob.arrayBuffer().then(buf => {
                    socket.emit('voice_message', { username: myName, audio: buf });
                });
                setStatus('');
                socket.emit('action_status', { username: myName, action: '' });
            };
            mediaRecorder.start();
            isRecording = true;
            recordBtn.classList.add('recording');
            recordBtn.textContent = '⏹';
            setStatus('Запись...', true);
            socket.emit('action_status', { username: myName, action: 'recording' });
        } catch(e) { alert('Нет доступа к микрофону'); }
    } else {
        mediaRecorder?.stop();
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '🎤';
    }
};

// ===== STATUS =====
function setStatus(text, shimmer = false) {
    statusBar.innerHTML = text ? (shimmer ? `<span class="shimmer-text">${esc(text)}</span>` : esc(text)) : '';
}

// ===== SOCKET EVENTS =====
socket.on('text_history', msgs => msgs.forEach(m => addMsg('text', m.username, m.text)));
socket.on('text_message', d => addMsg('text', d.username, d.text));
socket.on('voice_message', d => addMsg('voice', d.username, d.audio));
socket.on('image_message', d => addMsg('image', d.username, d.image, { mime: d.mime }));
socket.on('file_message', d => addMsg('file', d.username, d.file_data, { filename: d.filename, mime: d.mime, size: d.size }));
socket.on('user_joined', d => addMsg('system', '', d.msg));
socket.on('user_left', d => addMsg('system', '', d.msg));

socket.on('update_user_list', users => {
    onlineUsers.innerHTML = '';
    const others = users.filter(u => u !== myName);
    if (others.length === 0) {
        onlineUsers.innerHTML = '<span style="color:var(--text-2);font-size:0.9em">только вы</span>';
        return;
    }
    others.forEach(u => {
        const chip = document.createElement('div');
        chip.className = 'user-chip';
        const av = document.createElement('div');
        av.className = 'avatar';
        const userAv = userAvatars[u];
        if (userAv) {
            av.innerHTML = `<img src="data:image/jpeg;base64,${userAv}" alt="avatar">`;
        } else {
            av.style.background = avatarColor(u);
            av.textContent = initials(u);
        }
        const nameSpan = document.createElement('span');
        nameSpan.textContent = u;
        chip.appendChild(av);
        chip.appendChild(nameSpan);
        onlineUsers.appendChild(chip);
    });
    // Запрашиваем аватарки новых пользователей
    socket.emit('get_user_avatars', { usernames: users });
});

socket.on('user_avatars', avatars => {
    Object.assign(userAvatars, avatars);
});

socket.on('typing', d => {
    if (d.username === myName) return;
    statusBar.innerHTML = d.typing
        ? `<span class="typing-dots"><span></span><span></span><span></span></span> <span class="shimmer-text">${esc(d.username)} печатает...</span>`
        : '';
});

socket.on('action_status', d => {
    if (d.username === myName) return;
    if (d.action === 'recording') setStatus(`${d.username} записывает аудио...`, true);
    else if (d.action === 'sending_file') setStatus(`${d.username} отправляет файл...`, true);
    else setStatus('');
});
</script>
