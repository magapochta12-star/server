<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PyMessenger</title>
<meta name="theme-color" content="#3390EC">
<style>
:root {
    --bg: #E7EBF0;
    --surface: #FFFFFF;
    --surface-2: #F4F4F5;
    --text: #0F0F0F;
    --text-2: #707579;
    --border: #DAE1E4;
    --my-bubble: #EFFDDE;
    --my-bubble-grad: linear-gradient(135deg, #E3F7D0 0%, #EFFDDE 100%);
    --my-text: #0F0F0F;
    --other-bubble: #FFFFFF;
    --accent: #3390EC;
    --accent-hover: #1E88E5;
    --danger: #E53935;
    --shadow: 0 1px 2px rgba(0,0,0,0.08);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
}
body.dark {
    --bg: #0F0F0F;
    --surface: #181818;
    --surface-2: #202020;
    --text: #F4F4F5;
    --text-2: #A0A0A0;
    --border: #262626;
    --my-bubble: #766AC8;
    --my-bubble-grad: linear-gradient(135deg, #877ACE 0%, #766AC8 100%);
    --my-text: #FFFFFF;
    --other-bubble: #1E1E1E;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.4s ease, color 0.4s ease;
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

/* HEADER */
.header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    z-index: 10;
}
.header h1 {
    font-size: 1.25em; font-weight: 600; flex: 1;
    background: linear-gradient(135deg, var(--accent), #766AC8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
}
.icon-btn {
    width: 38px; height: 38px; border: none; background: transparent;
    border-radius: 50%; font-size: 1.2em; cursor: pointer;
    color: var(--text); display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    transition: background 0.2s;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(0.92); }

/* ONLINE USERS */
.online-bar {
    padding: 6px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    overflow-x: auto; scrollbar-width: none;
    font-size: 0.85em;
}
.online-bar::-webkit-scrollbar { display: none; }
.online-bar .label { color: var(--text-2); white-space: nowrap; }
.user-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px 4px 4px;
    background: var(--surface-2); border-radius: 20px;
    white-space: nowrap;
    animation: chipIn 0.3s ease-out;
}
.avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 600; font-size: 0.75em;
    flex-shrink: 0;
}
.avatar.lg { width: 40px; height: 40px; font-size: 0.9em; }
@keyframes chipIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
}

/* USERNAME INPUT */
.user-bar {
    padding: 8px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
}
.user-bar input {
    flex: 1; padding: 8px 14px; border: 1px solid var(--border);
    border-radius: 20px; background: var(--surface-2); color: var(--text);
    font-size: 0.9em; outline: none;
    transition: border-color 0.2s;
}
.user-bar input:focus { border-color: var(--accent); }

/* CHAT */
.chat {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 16px; display: flex; flex-direction: column; gap: 2px;
    -webkit-overflow-scrolling: touch;
    background-image:
        radial-gradient(circle at 20% 30%, rgba(51,144,236,0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(118,106,200,0.04) 0%, transparent 50%);
}
body.dark .chat {
    background-image:
        radial-gradient(circle at 20% 30%, rgba(51,144,236,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(118,106,200,0.06) 0%, transparent 50%);
}
.chat::-webkit-scrollbar { width: 6px; }
.chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* MESSAGE */
.msg-row {
    display: flex; gap: 8px; max-width: 85%;
    animation: msgIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.msg-row.my { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.other { align-self: flex-start; }
.msg-row.system {
    align-self: center; max-width: 90%;
    animation: sysIn 0.4s ease-out;
}
@keyframes msgIn {
    from { opacity: 0; transform: translateY(16px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes sysIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}
.bubble {
    padding: 8px 12px; border-radius: 16px;
    box-shadow: var(--shadow);
    word-wrap: break-word; word-break: break-word;
    position: relative;
    max-width: 100%;
}
.msg-row.my .bubble {
    background: var(--my-bubble-grad);
    color: var(--my-text);
    border-bottom-right-radius: 4px;
}
.msg-row.other .bubble {
    background: var(--other-bubble);
    border-bottom-left-radius: 4px;
}
.msg-row.continued { margin-top: -4px; }
.msg-row.continued.my .bubble { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
.msg-row.continued.other .bubble { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.msg-row.continued .avatar { visibility: hidden; }

.sender {
    font-weight: 600; font-size: 0.85em;
    margin-bottom: 2px; display: block;
}
.text { font-size: 0.95em; line-height: 1.35; white-space: pre-wrap; }
.meta {
    font-size: 0.7em; color: var(--text-2);
    float: right; margin-left: 10px; margin-top: 4px;
    opacity: 0.8;
}
.msg-row.my .meta { color: var(--my-text); opacity: 0.65; }

.sys-msg {
    background: var(--surface-2); color: var(--text-2);
    padding: 4px 12px; border-radius: 12px;
    font-size: 0.8em; text-align: center;
    font-style: italic;
}

.bubble img {
    max-width: 100%; border-radius: 12px; cursor: pointer;
    margin-top: 4px; display: block;
    transition: transform 0.3s;
}
.bubble img:hover { transform: scale(1.02); }
.bubble audio { max-width: 100%; margin-top: 4px; border-radius: 20px; }
.file-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; margin-top: 4px;
    background: var(--surface-2); color: var(--text);
    border-radius: 14px; text-decoration: none;
    font-size: 0.85em; font-weight: 500;
    transition: background 0.2s;
}
.file-link:hover { background: var(--border); }
.msg-row.my .file-link { background: rgba(0,0,0,0.1); color: var(--my-text); }

/* STATUS BAR */
.status-bar {
    padding: 4px 16px; min-height: 22px;
    font-size: 0.85em; color: var(--accent);
    display: flex; align-items: center; gap: 6px;
    background: var(--surface);
    border-top: 1px solid var(--border);
}
.typing-dots { display: inline-flex; gap: 3px; }
.typing-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    animation: dotBounce 1.4s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-5px); opacity: 1; }
}
.shimmer-text {
    background: linear-gradient(90deg, var(--accent) 0%, #766AC8 50%, var(--accent) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 2s infinite linear;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* INPUT */
.input-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
#text-input {
    flex: 1; padding: 10px 16px; border: none;
    border-radius: 22px; background: var(--surface-2);
    color: var(--text); font-size: 0.95em; outline: none;
    transition: background 0.2s;
}
#text-input:focus { background: var(--border); }
.send-btn {
    width: 42px; height: 42px; border: none;
    border-radius: 50%; background: var(--accent);
    color: white; font-size: 1.2em; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg);
    transition: transform 0.2s, background 0.2s;
    position: relative; overflow: hidden;
}
.send-btn:hover { background: var(--accent-hover); }
.send-btn:active { transform: scale(0.9); }
.record-btn.recording {
    background: var(--danger);
    animation: pulse 1.2s infinite;
}
@keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.5); }
    50% { box-shadow: 0 0 0 12px rgba(229,57,53,0); }
}
/* Ripple effect */
.ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transform: scale(0); animation: rippleAnim 0.6s linear;
    pointer-events: none;
}
@keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

/* GALLERY */
.gallery {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.95); z-index: 1000;
    justify-content: center; align-items: center;
    animation: fadeIn 0.25s ease-out;
}
.gallery.active { display: flex; }
.gallery img {
    max-width: 95%; max-height: 90vh;
    border-radius: 8px;
    animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes zoomIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.gallery-close {
    position: absolute; top: 20px; right: 20px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: none;
    color: white; font-size: 1.5em; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
}
.gallery-close:hover { background: rgba(255,255,255,0.3); }

@media (max-width: 500px) {
    .msg-row { max-width: 92%; }
    .header h1 { font-size: 1.1em; }
    .icon-btn { width: 36px; height: 36px; }
}
</style>
</head>
<body>
    <div class="header">
        <h1>PyMessenger</h1>
        <button class="icon-btn" id="notif-btn" title="Уведомления">🔔</button>
        <button class="icon-btn" id="theme-btn" title="Тема">🌙</button>
    </div>

    <div class="user-bar">
        <input type="text" id="username" placeholder="Ваше имя" value="Гость" maxlength="30">
    </div>

    <div class="online-bar">
        <span class="label">Онлайн:</span>
        <span id="online-users"></span>
    </div>

    <div class="chat" id="chat"></div>

    <div class="status-bar" id="status-bar"></div>

    <div class="input-bar">
        <input type="text" id="text-input" placeholder="Сообщение..." maxlength="2000" autocomplete="off">
        <button class="icon-btn" onclick="document.getElementById('img-in').click()" title="Фото">🖼️</button>
        <button class="icon-btn" onclick="document.getElementById('file-in').click()" title="Файл">📎</button>
        <button class="icon-btn record-btn" id="record-btn" title="Голосовое">🎤</button>
        <button class="send-btn" id="send-btn" title="Отправить">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <input type="file" id="img-in" accept="image/*" multiple hidden>
        <input type="file" id="file-in" hidden>
    </div>

    <div class="gallery" id="gallery">
        <button class="gallery-close" id="gallery-close">✕</button>
        <img id="gallery-img" src="" alt="">
    </div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io();
const chat = document.getElementById('chat');
const textInput = document.getElementById('text-input');
const usernameInput = document.getElementById('username');
const recordBtn = document.getElementById('record-btn');
const sendBtn = document.getElementById('send-btn');
const onlineUsers = document.getElementById('online-users');
const themeBtn = document.getElementById('theme-btn');
const notifBtn = document.getElementById('notif-btn');
const statusBar = document.getElementById('status-bar');
const imgIn = document.getElementById('img-in');
const fileIn = document.getElementById('file-in');
const gallery = document.getElementById('gallery');
const galleryImg = document.getElementById('gallery-img');
const galleryClose = document.getElementById('gallery-close');

let myName = (localStorage.getItem('name') || 'Гость').slice(0, 30);
usernameInput.value = myName;
let lastSender = null;
let mediaRecorder, audioChunks = [], isRecording = false;
let typingTimer, isTyping = false;
let notificationsOn = localStorage.getItem('notif') === '1';

const AVATAR_COLORS = ['#3390EC','#E53935','#43A047','#FB8C00','#8E24AA','#00ACC1','#6D4C41','#546E7A','#D81B60','#3949AB'];
function avatarColor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(name) {
    const p = name.trim().split(/\s+/);
    return (p[0][0] + (p[1]?.[0] || '')).toUpperCase() || '?';
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(b) {
    if (b < 1024) return b + ' Б';
    if (b < 1048576) return (b/1024).toFixed(1) + ' КБ';
    return (b/1048576).toFixed(1) + ' МБ';
}
function timeNow() {
    const d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

// ===== ТЕМА =====
function applyTheme(t) {
    document.body.classList.toggle('dark', t === 'dark');
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', t);
    document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0F0F0F' : '#3390EC';
}
applyTheme(localStorage.getItem('theme') || 'light');
themeBtn.onclick = () => applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');

// ===== УВЕДОМЛЕНИЯ =====
notifBtn.style.opacity = notificationsOn ? '1' : '0.5';
notifBtn.onclick = async () => {
    if (!('Notification' in window)) { alert('Уведомления не поддерживаются'); return; }
    if (Notification.permission === 'granted') {
        notificationsOn = !notificationsOn;
        localStorage.setItem('notif', notificationsOn ? '1' : '0');
        notifBtn.style.opacity = notificationsOn ? '1' : '0.5';
    } else if (Notification.permission !== 'denied') {
        const p = await Notification.requestPermission();
        if (p === 'granted') {
            notificationsOn = true;
            localStorage.setItem('notif', '1');
            notifBtn.style.opacity = '1';
        }
    }
};
function notify(title, body) {
    if (notificationsOn && document.hidden && Notification.permission === 'granted') {
        try { new Notification(title, { body, silent: false }); } catch(e) {}
    }
}

// ===== ИМЯ =====
usernameInput.onchange = () => {
    myName = (usernameInput.value.trim() || 'Гость').slice(0, 30);
    usernameInput.value = myName;
    localStorage.setItem('name', myName);
    socket.emit('register', { username: myName });
    lastSender = null; // сбрасываем группировку
};

// ===== RIPPLE =====
document.querySelectorAll('.send-btn, .icon-btn').forEach(btn => {
    btn.addEventListener('click', e => {
        const r = document.createElement('span');
        r.className = 'ripple';
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        r.style.width = r.style.height = size + 'px';
        r.style.left = (e.clientX - rect.left - size/2) + 'px';
        r.style.top = (e.clientY - rect.top - size/2) + 'px';
        btn.appendChild(r);
        setTimeout(() => r.remove(), 600);
    });
});

// ===== ГАЛЕРЕЯ =====
function openGallery(src) {
    galleryImg.src = src;
    gallery.classList.add('active');
}
galleryClose.onclick = e => { e.stopPropagation(); closeGallery(); };
gallery.onclick = closeGallery;
function closeGallery() { gallery.classList.remove('active'); galleryImg.src = ''; }

// ===== СООБЩЕНИЯ =====
function addMsg(type, username, content, extra = {}) {
    const row = document.createElement('div');
    row.className = 'msg-row';
    if (type === 'system') {
        row.classList.add('system');
        row.innerHTML = `<div class="sys-msg">${esc(content)}</div>`;
        chat.appendChild(row);
        scrollDown();
        return;
    }
    const isMy = username === myName;
    row.classList.add(isMy ? 'my' : 'other');

    // Группировка: если предыдущее сообщение от того же — продолжаем
    const continued = lastSender === username;
    if (continued) row.classList.add('continued');

    const av = document.createElement('div');
    av.className = 'avatar lg';
    av.style.background = avatarColor(username);
    av.textContent = initials(username);
    row.appendChild(av);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (!continued && !isMy) {
        const s = document.createElement('span');
        s.className = 'sender';
        s.style.color = avatarColor(username);
        s.textContent = username;
        bubble.appendChild(s);
    }

    if (type === 'text') {
        const t = document.createElement('div');
        t.className = 'text';
        t.textContent = content;
        bubble.appendChild(t);
        notify(username, content.slice(0, 80));
    } else if (type === 'voice') {
        const label = document.createElement('div');
        label.className = 'text';
        label.innerHTML = '🎤 <b>Голосовое сообщение</b>';
        bubble.appendChild(label);
        const aud = document.createElement('audio');
        aud.controls = true;
        const blob = content instanceof Blob ? content : b64toBlob(content, 'audio/webm');
        aud.src = URL.createObjectURL(blob);
        bubble.appendChild(aud);
        notify(username, '🎤 Голосовое сообщение');
    } else if (type === 'image') {
        const img = document.createElement('img');
        const blob = content instanceof Blob ? content : b64toBlob(content, extra.mime || 'image/jpeg');
        const url = URL.createObjectURL(blob);
        img.src = url;
        img.onclick = () => openGallery(url);
        bubble.appendChild(img);
        notify(username, '📷 Фото');
    } else if (type === 'file') {
        const label = document.createElement('div');
        label.className = 'text';
        label.innerHTML = `📎 <b>${esc(extra.filename)}</b> <small>(${fmtSize(extra.size)})</small>`;
        bubble.appendChild(label);
        const a = document.createElement('a');
        a.className = 'file-link';
        a.href = URL.createObjectURL(b64toBlob(content, extra.mime || 'application/octet-stream'));
        a.download = extra.filename;
        a.textContent = '⬇ Скачать';
        bubble.appendChild(a);
        notify(username, '📎 ' + extra.filename);
    }

    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = timeNow();
    bubble.appendChild(meta);

    row.appendChild(bubble);
    chat.appendChild(row);
    lastSender = username;
    scrollDown();
}
function scrollDown() {
    requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
}
function b64toBlob(b64, mime) {
    const byteChars = atob(b64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    return new Blob([new Uint8Array(byteNumbers)], { type: mime });
}

// ===== ОТПРАВКА ТЕКСТА =====
function sendText() {
    const txt = textInput.value.trim();
    if (!txt) return;
    socket.emit('text_message', { username: myName, text: txt });
    textInput.value = '';
    setTyping(false);
}
sendBtn.onclick = sendText;
textInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } };
textInput.oninput = () => {
    if (textInput.value.trim() && !isTyping) setTyping(true);
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => setTyping(false), 2000);
};
function setTyping(v) {
    if (v === isTyping) return;
    isTyping = v;
    socket.emit('typing', { username: myName, typing: v });
}

// ===== ФОТО =====
imgIn.onchange = async () => {
    const files = Array.from(imgIn.files);
    imgIn.value = '';
    for (const f of files) {
        if (f.size > 5 * 1024 * 1024) { alert('Макс. 5 МБ для фото'); continue; }
        try {
            setStatus('Отправка фото...', true);
            const blob = await compressImg(f);
            blob.arrayBuffer().then(buf => {
                socket.emit('image_message', {
                    username: myName, image: buf, mime: blob.type
                });
                setStatus('');
            });
        } catch(e) { addMsg('system', '', 'Ошибка: ' + e.message); setStatus(''); }
    }
};
function compressImg(file) {
    return new Promise((res, rej) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url);
            let { width, height } = img;
            const M = 1920;
            if (width > M || height > M) {
                const k = M / Math.max(width, height);
                width *= k; height *= k;
            }
            const c = document.createElement('canvas');
            c.width = width; c.height = height;
            c.getContext('2d').drawImage(img, 0, 0, width, height);
            const tryQ = q => {
                c.toBlob(b => {
                    if (!b) return c.toBlob(x => res(x), 'image/jpeg', 0.3);
                    if (b.size <= 500*1024 || q <= 0.25) res(b);
                    else tryQ(q - 0.1);
                }, 'image/jpeg', q);
            };
            tryQ(0.75);
        };
        img.onerror = rej;
        img.src = url;
    });
}

// ===== ФАЙЛЫ =====
fileIn.onchange = () => {
    const f = fileIn.files[0];
    fileIn.value = '';
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) { alert('Макс. 10 МБ'); return; }
    setStatus('Отправка файла...', true);
    socket.emit('action_status', { username: myName, action: 'sending_file' });
    const reader = new FileReader();
    reader.onload = () => {
        socket.emit('file_message', {
            username: myName, filename: f.name,
            file_data: reader.result, mime: f.type || 'application/octet-stream',
            size: f.size
        });
        setStatus('');
    };
    reader.readAsArrayBuffer(f);
};

// ===== ГОЛОС =====
recordBtn.onclick = async () => {
    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                stream.getTracks().forEach(t => t.stop());
                blob.arrayBuffer().then(buf => {
                    socket.emit('voice_message', { username: myName, audio: buf });
                });
                setStatus('');
                socket.emit('action_status', { username: myName, action: '' });
            };
            mediaRecorder.start();
            isRecording = true;
            recordBtn.classList.add('recording');
            recordBtn.textContent = '⏹';
            setStatus('Запись...', true);
            socket.emit('action_status', { username: myName, action: 'recording' });
        } catch(e) { alert('Нет доступа к микрофону'); }
    } else {
        mediaRecorder?.stop();
        isRecording = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '🎤';
    }
};

// ===== СТАТУС =====
function setStatus(text, shimmer = false) {
    statusBar.innerHTML = text ? (shimmer ? `<span class="shimmer-text">${esc(text)}</span>` : esc(text)) : '';
}

// ===== СОКЕТ-СОБЫТИЯ =====
socket.on('connect', () => {
    socket.emit('register', { username: myName });
});
socket.on('text_history', msgs => msgs.forEach(m => addMsg('text', m.username, m.text)));
socket.on('text_message', d => addMsg('text', d.username, d.text));
socket.on('voice_message', d => addMsg('voice', d.username, d.audio));
socket.on('image_message', d => addMsg('image', d.username, d.image, { mime: d.mime }));
socket.on('file_message', d => addMsg('file', d.username, d.file_data, { filename: d.filename, mime: d.mime, size: d.size }));
socket.on('user_joined', d => addMsg('system', '', d.msg));
socket.on('user_left', d => addMsg('system', '', d.msg));
socket.on('update_user_list', users => {
    onlineUsers.innerHTML = '';
    users.filter(u => u !== myName).forEach(u => {
        const chip = document.createElement('div');
        chip.className = 'user-chip';
        chip.innerHTML = `<div class="avatar" style="background:${avatarColor(u)}">${initials(u)}</div><span>${esc(u)}</span>`;
        onlineUsers.appendChild(chip);
    });
    if (users.filter(u => u !== myName).length === 0) {
        onlineUsers.innerHTML = '<span style="color:var(--text-2);font-size:0.9em">только вы</span>';
    }
});
socket.on('typing', d => {
    if (d.username === myName) return;
    const t = d.typing
        ? `<span class="typing-dots"><span></span><span></span><span></span></span> <span class="shimmer-text">${esc(d.username)} печатает...</span>`
        : '';
    statusBar.innerHTML = t;
});
socket.on('action_status', d => {
    if (d.username === myName) return;
    if (d.action === 'recording') setStatus(`${d.username} записывает аудио...`, true);
    else if (d.action === 'sending_file') setStatus(`${d.username} отправляет файл...`, true);
    else setStatus('');
});
</script>
