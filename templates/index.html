<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PyMessenger</title>
<meta name="theme-color" content="#3390EC">
<style>
:root {
    --bg: #E7EBF0; --surface: #FFFFFF; --surface-2: #F4F4F5;
    --text: #0F0F0F; --text-2: #707579; --border: #DAE1E4;
    --my-bubble-grad: linear-gradient(135deg, #E3F7D0 0%, #EFFDDE 100%);
    --my-text: #0F0F0F; --other-bubble: #FFFFFF;
    --accent: #3390EC; --accent-hover: #1E88E5;
    --danger: #E53935; --success: #43A047;
    --shadow: 0 1px 2px rgba(0,0,0,0.08); --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
}
body.dark {
    --bg: #0F0F0F; --surface: #181818; --surface-2: #202020;
    --text: #F4F4F5; --text-2: #A0A0A0; --border: #262626;
    --my-bubble-grad: linear-gradient(135deg, #877ACE 0%, #766AC8 100%);
    --my-text: #FFFFFF; --other-bubble: #1E1E1E;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    transition: background 0.4s ease, color 0.4s ease;
    max-width: 1200px; margin: 0 auto;
    display: flex; flex-direction: column;
}

/* AUTH */
.auth-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 2000; animation: fadeIn 0.5s ease-out;
}
.auth-card {
    background: var(--surface); border-radius: 24px;
    padding: 40px 32px; width: min(90%, 400px);
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes slideUp { from { opacity: 0; transform: translateY(40px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.auth-logo {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, var(--accent), #766AC8);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 2em; margin: 0 auto 24px;
    animation: logoSpin 1s ease-out;
    box-shadow: 0 8px 24px rgba(51,144,236,0.3);
}
@keyframes logoSpin { from { transform: scale(0) rotate(-180deg); } to { transform: scale(1) rotate(0deg); } }
.auth-card h1 {
    text-align: center; font-size: 1.8em; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), #766AC8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.auth-card p { text-align: center; color: var(--text-2); margin-bottom: 24px; font-size: 0.9em; }
.auth-input {
    width: 100%; padding: 14px 18px; border: 2px solid var(--border);
    border-radius: 14px; background: var(--surface-2); color: var(--text);
    font-size: 1em; outline: none; margin-bottom: 12px;
    transition: border-color 0.3s, box-shadow 0.3s;
}
.auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(51,144,236,0.15); }
.auth-btn {
    width: 100%; padding: 14px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #766AC8);
    color: white; font-size: 1.05em; font-weight: 600; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s; margin-bottom: 12px;
    position: relative; overflow: hidden;
}
.auth-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(51,144,236,0.35); }
.auth-btn:active { transform: translateY(0); }
.auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.auth-switch { text-align: center; color: var(--text-2); font-size: 0.9em; }
.auth-switch a { color: var(--accent); text-decoration: none; font-weight: 600; cursor: pointer; }
.auth-error {
    background: rgba(229,57,53,0.1); color: var(--danger);
    padding: 10px 16px; border-radius: 12px; font-size: 0.85em;
    margin-bottom: 16px; text-align: center; animation: shake 0.4s; display: none;
}
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* CHAT APP */
.chat-app { display: none; flex-direction: column; height: 100%; animation: fadeIn 0.5s ease-out; }
.chat-app.visible { display: flex; }

.header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 10;
}
.header h1 {
    font-size: 1.25em; font-weight: 600; flex: 1;
    background: linear-gradient(135deg, var(--accent), #766AC8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.icon-btn {
    width: 38px; height: 38px; border: none; background: transparent;
    border-radius: 50%; font-size: 1.2em; cursor: pointer;
    color: var(--text); display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; transition: background 0.2s, transform 0.2s;
    flex-shrink: 0;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(0.9); }

.main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }

.sidebar {
    width: 280px; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    flex-shrink: 0;
}
.sidebar-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
}
.my-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface-2); display: flex; align-items: center; justify-content: center;
    font-weight: 600; color: var(--text-2); cursor: pointer; overflow: hidden;
    border: 2px solid var(--border); transition: border-color 0.2s, transform 0.2s;
    flex-shrink: 0;
}
.my-avatar:hover { border-color: var(--accent); transform: scale(1.05); }
.my-avatar img { width: 100%; height: 100%; object-fit: cover; }
.my-name { font-weight: 600; font-size: 0.95em; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logout-btn {
    padding: 6px 12px; border: none;
    background: var(--surface-2); color: var(--text-2);
    border-radius: 20px; font-size: 0.8em; cursor: pointer; flex-shrink: 0;
}
.chat-list { flex: 1; overflow-y: auto; }
.chat-list-item {
    padding: 12px 16px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    transition: background 0.2s;
}
.chat-list-item:hover { background: var(--surface-2); }
.chat-list-item.active { background: var(--accent); color: white; }
.chat-list-item .avatar { width: 36px; height: 36px; font-size: 0.8em; }

.overlay {
    display: none; position: absolute; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 150;
    animation: fadeIn 0.2s;
}
.overlay.active { display: block; }

.chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
.chat-header {
    padding: 10px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
}
.chat-header h2 { font-size: 1.1em; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-btn { display: none; }

.chat {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 16px; display: flex; flex-direction: column; gap: 2px;
    -webkit-overflow-scrolling: touch;
    background-image:
        radial-gradient(circle at 20% 30%, rgba(51,144,236,0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(118,106,200,0.04) 0%, transparent 50%);
}
body.dark .chat {
    background-image:
        radial-gradient(circle at 20% 30%, rgba(51,144,236,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(118,106,200,0.06) 0%, transparent 50%);
}
.chat::-webkit-scrollbar { width: 6px; }
.chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.msg-row {
    display: flex; gap: 8px; max-width: 85%;
    animation: msgIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
}
.msg-row.my { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.other { align-self: flex-start; }
.msg-row.system { align-self: center; max-width: 90%; animation: sysIn 0.4s ease-out; }
@keyframes msgIn { from { opacity: 0; transform: translateY(16px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes sysIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
.bubble {
    padding: 8px 12px; border-radius: 16px;
    box-shadow: var(--shadow); word-wrap: break-word; word-break: break-word;
    max-width: 100%; position: relative; min-width: 0;
}
.msg-row.my .bubble { background: var(--my-bubble-grad); color: var(--my-text); border-bottom-right-radius: 4px; }
.msg-row.other .bubble { background: var(--other-bubble); border-bottom-left-radius: 4px; }
.msg-row.continued { margin-top: -4px; }
.msg-row.continued .avatar { visibility: hidden; }
.sender { font-weight: 600; font-size: 0.85em; margin-bottom: 2px; display: block; }
.text { font-size: 0.95em; line-height: 1.35; white-space: pre-wrap; }
.meta { font-size: 0.7em; color: var(--text-2); float: right; margin-left: 10px; margin-top: 4px; opacity: 0.8; }
.msg-row.my .meta { color: var(--my-text); opacity: 0.65; }
.edited-label { font-size: 0.7em; color: var(--text-2); opacity: 0.7; font-style: italic; }
.sys-msg {
    background: var(--surface-2); color: var(--text-2);
    padding: 4px 12px; border-radius: 12px;
    font-size: 0.8em; text-align: center; font-style: italic;
}
.bubble img { max-width: 100%; border-radius: 12px; cursor: pointer; margin-top: 4px; display: block; }
.bubble audio { max-width: 100%; margin-top: 4px; border-radius: 20px; }
.file-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; margin-top: 4px;
    background: var(--surface-2); color: var(--text);
    border-radius: 14px; text-decoration: none; font-size: 0.85em; font-weight: 500;
}
.msg-row.my .file-link { background: rgba(0,0,0,0.1); color: var(--my-text); }

.msg-menu-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    opacity: 0; width: 28px; height: 28px; border: none;
    background: var(--surface-2); border-radius: 50%;
    cursor: pointer; font-size: 0.9em;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s; z-index: 10;
    box-shadow: var(--shadow);
}
.msg-row.my .msg-menu-btn { left: -36px; }
.msg-row.other .msg-menu-btn { right: -36px; }
.msg-row:hover .msg-menu-btn { opacity: 1; }

.context-menu {
    position: fixed; z-index: 5000;
    background: var(--surface); border-radius: 12px;
    box-shadow: var(--shadow-lg); padding: 6px 0; min-width: 160px;
    animation: menuIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); display: none;
}
@keyframes menuIn { from { opacity: 0; transform: scale(0.8) translateY(-8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.context-menu.visible { display: block; }
.context-menu button {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 12px 16px; border: none;
    background: none; color: var(--text); font-size: 0.95em;
    cursor: pointer; transition: background 0.15s; text-align: left;
}
.context-menu button:hover { background: var(--surface-2); }
.context-menu button.danger { color: var(--danger); }

.edit-bar {
    display: none; padding: 8px 16px; background: var(--surface);
    border-top: 1px solid var(--border); font-size: 0.85em; color: var(--accent);
    align-items: center; justify-content: space-between;
}
.edit-bar.active { display: flex; }
.edit-bar button { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.2em; }

.status-bar {
    padding: 4px 16px; min-height: 22px; font-size: 0.85em; color: var(--accent);
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border-top: 1px solid var(--border);
}
.typing-dots { display: inline-flex; gap: 3px; }
.typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: dotBounce 1.4s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotBounce { 0%,60%,100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-5px); opacity: 1; } }
.shimmer-text {
    background: linear-gradient(90deg, var(--accent) 0%, #766AC8 50%, var(--accent) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    animation: shimmer 2s infinite linear;
}
@keyframes shimmer { to { background-position: -200% 0; } }

.input-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px; background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
#text-input {
    flex: 1; min-width: 0; padding: 10px 16px; border: none; border-radius: 22px;
    background: var(--surface-2); color: var(--text); font-size: 0.95em; outline: none;
}
.send-btn {
    width: 42px; height: 42px; border: none; border-radius: 50%;
    background: var(--accent); color: white; font-size: 1.2em; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg); transition: transform 0.2s; position: relative; overflow: hidden;
    flex-shrink: 0;
}
.send-btn:active { transform: scale(0.9); }
.record-btn.recording { background: var(--danger); animation: pulse 1.2s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.5); } 50% { box-shadow: 0 0 0 12px rgba(229,57,53,0); } }
.ripple {
    position: absolute; border-radius: 50%; background: rgba(255,255,255,0.5);
    transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none;
}
@keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

.gallery {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.95); z-index: 1000;
    justify-content: center; align-items: center;
}
.gallery.active { display: flex; }
.gallery img { max-width: 95%; max-height: 90vh; border-radius: 8px; animation: zoomIn 0.3s; }
@keyframes zoomIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.gallery-close {
    position: absolute; top: 20px; right: 20px; width: 44px; height: 44px;
    border-radius: 50%; background: rgba(255,255,255,0.15); border: none;
    color: white; font-size: 1.5em; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
.avatar-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 1500;
    justify-content: center; align-items: center;
}
.avatar-modal.active { display: flex; }
.avatar-modal-content {
    background: var(--surface); border-radius: 20px; padding: 24px; text-align: center;
    animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: min(90%, 320px);
}
.avatar-preview {
    width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 16px;
    overflow: hidden; background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
}
.avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
.avatar-modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.avatar-modal-btns button {
    padding: 10px 20px; border: none; border-radius: 12px;
    cursor: pointer; font-size: 0.9em; font-weight: 600;
}
.avatar-save { background: var(--accent); color: white; }
.avatar-cancel { background: var(--surface-2); color: var(--text); }
.msg-row.deleting { animation: msgOut 0.3s ease-in forwards; }
@keyframes msgOut { to { opacity: 0; transform: translateX(30px) scale(0.9); } }

.avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 600; font-size: 0.7em;
    flex-shrink: 0; overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.lg { width: 40px; height: 40px; font-size: 0.85em; }

/* 📱 МОБИЛЬНАЯ АДАПТАЦИЯ */
@media (max-width: 768px) {
    .sidebar {
        position: absolute; left: 0; top: 0; bottom: 0;
        z-index: 200; transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: var(--shadow-lg);
        width: min(280px, 80vw);
    }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: flex; }
    .msg-row { max-width: 92%; }
    .msg-menu-btn { width: 26px; height: 26px; font-size: 0.8em; top: 4px; transform: none; }
    .msg-row.my .msg-menu-btn { left: auto; right: 4px; }
    .msg-row.other .msg-menu-btn { right: auto; left: 4px; }
}
@media (hover: none) {
    .msg-menu-btn { opacity: 0.55; }
    .msg-row.my .msg-menu-btn { background: rgba(0,0,0,0.12); color: var(--my-text); }
    .msg-row.other .msg-menu-btn { background: rgba(0,0,0,0.08); color: var(--text-2); }
}
@media (max-width: 600px) {
    .icon-btn { width: 34px; height: 34px; font-size: 1.05em; }
    .send-btn { width: 40px; height: 40px; }
    .input-bar { gap: 4px; padding: 6px 8px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); }
    #text-input { padding: 9px 14px; font-size: 16px; }
    .auth-input { font-size: 16px; }
    .header { padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
    .header h1 { font-size: 1.1em; }
    .chat { padding: 12px 8px; }
    .chat-header { padding: 8px 12px; }
}
@media (max-width: 380px) {
    .icon-btn { width: 30px; height: 30px; font-size: 0.95em; }
    .send-btn { width: 36px; height: 36px; }
    .input-bar { gap: 3px; }
    #text-input { padding: 8px 12px; }
}
</style>
</head>
<body>

<div class="auth-screen" id="auth-screen">
    <div class="auth-card">
        <div class="auth-logo">💬</div>
        <h1>PyMessenger</h1>
        <p id="auth-subtitle">Войдите в свой аккаунт</p>
        <div class="auth-error" id="auth-error"></div>
        <input type="text" class="auth-input" id="auth-username" placeholder="Ник" maxlength="30">
        <input type="password" class="auth-input" id="auth-password" placeholder="Пароль">
        <button class="auth-btn" id="auth-submit" onclick="submitAuth()">Войти</button>
        <div class="auth-switch" id="auth-switch">
            Нет аккаунта? <a onclick="switchAuthMode()">Зарегистрироваться</a>
        </div>
    </div>
</div>

<div class="chat-app" id="chat-app">
    <div class="header">
        <h1>PyMessenger</h1>
        <button class="icon-btn" id="theme-btn">🌙</button>
    </div>
    
    <div class="main-layout">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="my-avatar" id="my-avatar" onclick="openAvatarModal()"><span>?</span></div>
                <span class="my-name" id="my-name">Гость</span>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
            <div class="chat-list" id="chat-list">
                <div class="chat-list-item active" onclick="switchToGeneral()">
                    <div class="avatar" style="background: var(--accent);">💬</div>
                    <span>Общий чат</span>
                </div>
            </div>
        </div>
        <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
        
        <div class="chat-area">
            <div class="chat-header">
                <button class="icon-btn menu-btn" id="menu-btn" onclick="toggleSidebar()">☰</button>
                <h2 id="chat-title">Общий чат</h2>
            </div>
            <div class="chat" id="chat"></div>
            <div class="status-bar" id="status-bar"></div>
            <div class="edit-bar" id="edit-bar">
                <span>✏️ Редактирование сообщения</span>
                <button onclick="cancelEdit()">✕</button>
            </div>
            <div class="input-bar">
                <input type="text" id="text-input" placeholder="Сообщение..." maxlength="2000">
                <button class="icon-btn" onclick="document.getElementById('img-in').click()">🖼️</button>
                <button class="icon-btn" onclick="document.getElementById('file-in').click()">📎</button>
                <button class="icon-btn record-btn" id="record-btn">🎤</button>
                <button class="send-btn" id="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
                <input type="file" id="img-in" accept="image/*" multiple hidden>
                <input type="file" id="file-in" hidden>
            </div>
        </div>
    </div>
</div>

<div class="context-menu" id="context-menu">
    <button id="menu-edit" onclick="startEdit()">✏️ Изменить</button>
    <button class="danger" onclick="deleteMsg()">🗑️ Удалить</button>
</div>

<div class="gallery" id="gallery">
    <button class="gallery-close" id="gallery-close">✕</button>
    <img id="gallery-img" src="" alt="">
</div>

<div class="avatar-modal" id="avatar-modal">
    <div class="avatar-modal-content">
        <h3>Аватарка</h3>
        <div class="avatar-preview" id="avatar-preview"><span>?</span></div>
        <input type="file" id="avatar-input" accept="image/*" hidden>
        <div class="avatar-modal-btns">
            <button class="avatar-save" onclick="document.getElementById('avatar-input').click()">Выбрать фото</button>
            <button class="avatar-cancel" onclick="closeAvatarModal()">Отмена</button>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io();
let myName = '', myAvatar = null;
let clientId = getClientId();
let isAuthMode = 'login', lastSender = null;
let mediaRecorder, audioChunks = [], isRecording = false;
let typingTimer, isTyping = false;
let editingMsgId = null;
let contextMsgId = null;
let contextMsgUser = null;
let contextMsgIsPrivate = false;
let currentChat = 'general';
let currentChatUser = null;
const userAvatars = {};
const messageElements = {};
const privateMessageElements = {};

// 📱 АВТО-ОПРЕДЕЛЕНИЕ УСТРОЙСТВА
const mobileQuery = window.matchMedia('(max-width: 768px)');
let isMobile = mobileQuery.matches;
mobileQuery.addEventListener('change', e => {
    isMobile = e.matches;
    if (!isMobile) closeSidebar();
});

function getClientId() {
    let id = localStorage.getItem('client_id');
    if (!id) { id = 'c_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('client_id', id); }
    return id;
}

const $ = id => document.getElementById(id);
const chat = $('chat'), textInput = $('text-input'), recordBtn = $('record-btn');
const contextMenu = $('context-menu'), editBar = $('edit-bar');

// AUTH
function switchAuthMode() {
    isAuthMode = isAuthMode === 'login' ? 'register' : 'login';
    $('auth-submit').textContent = isAuthMode === 'login' ? 'Войти' : 'Зарегистрироваться';
    $('auth-subtitle').textContent = isAuthMode === 'login' ? 'Войдите в свой аккаунт' : 'Создайте новый аккаунт';
    $('auth-switch').innerHTML = isAuthMode === 'login'
        ? 'Нет аккаунта? <a onclick="switchAuthMode()">Зарегистрироваться</a>'
        : 'Есть аккаунт? <a onclick="switchAuthMode()">Войти</a>';
    $('auth-error').style.display = 'none';
    $('auth-password').value = '';
}
function submitAuth() {
    const u = $('auth-username').value.trim(), p = $('auth-password').value;
    if (!u || !p) { showAuthError('Заполните все поля'); return; }
    $('auth-submit').disabled = true; $('auth-submit').textContent = 'Подождите...';
    socket.emit(isAuthMode === 'login' ? 'login' : 'register', { username: u, password: p, client_id: clientId });
}
function showAuthError(m) {
    $('auth-error').textContent = m; $('auth-error').style.display = 'block';
    $('auth-submit').disabled = false;
    $('auth-submit').textContent = isAuthMode === 'login' ? 'Войти' : 'Зарегистрироваться';
}
$('auth-password').onkeydown = e => { if (e.key === 'Enter') submitAuth(); };
$('auth-username').onkeydown = e => { if (e.key === 'Enter') $('auth-password').focus(); };

socket.on('auth_success', d => {
    myName = d.username; myAvatar = d.avatar || null;
    localStorage.setItem('name', myName);
    $('auth-screen').style.cssText = 'opacity:0;transform:scale(0.95);transition:all 0.4s';
    setTimeout(() => { $('auth-screen').style.display = 'none'; $('chat-app').classList.add('visible'); updateMyProfile(); }, 400);
});
socket.on('auth_error', d => showAuthError(d.message));
socket.on('session_expired', () => { $('auth-screen').style.cssText = 'display:flex'; $('chat-app').classList.remove('visible'); });
socket.on('connect', () => socket.emit('check_session', { client_id: clientId }));

function updateMyProfile() {
    $('my-name').textContent = myName;
    $('my-avatar').innerHTML = myAvatar ? `<img src="data:image/jpeg;base64,${myAvatar}">` : `<span>${myName[0]?.toUpperCase()||'?'}</span>`;
}
function logout() { localStorage.removeItem('client_id'); localStorage.removeItem('name'); location.reload(); }

// AVATAR
function openAvatarModal() {
    $('avatar-modal').classList.add('active');
    $('avatar-preview').innerHTML = myAvatar ? `<img src="data:image/jpeg;base64,${myAvatar}">` : `<span>${myName[0]||'?'}</span>`;
}
function closeAvatarModal() { $('avatar-modal').classList.remove('active'); }
$('avatar-modal').onclick = e => { if (e.target === $('avatar-modal')) closeAvatarModal(); };
$('avatar-input').onchange = async () => {
    const f = $('avatar-input').files[0]; if (!f) return;
    $('avatar-input').value = '';
    const blob = await compressImage(f, 128);
    const r = new FileReader();
    r.onload = () => {
        myAvatar = r.result.split(',')[1];
        socket.emit('set_avatar', { username: myName, avatar: r.result });
        updateMyProfile();
        $('avatar-preview').innerHTML = `<img src="data:image/jpeg;base64,${myAvatar}">`;
    };
    r.readAsDataURL(blob);
};
socket.on('avatar_updated', d => { userAvatars[d.username] = d.avatar; if (d.username === myName) { myAvatar = d.avatar; updateMyProfile(); } });

// THEME
function applyTheme(t) { document.body.classList.toggle('dark', t==='dark'); $('theme-btn').textContent = t==='dark'?'☀️':'🌙'; localStorage.setItem('theme', t); }
applyTheme(localStorage.getItem('theme') || 'light');
$('theme-btn').onclick = () => applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');

// HELPERS
const COLORS = ['#3390EC','#E53935','#43A047','#FB8C00','#8E24AA','#00ACC1','#6D4C41','#D81B60'];
function avatarColor(n) { let h=0; for(let i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0; return COLORS[h%COLORS.length]; }
function initials(n) { const p=n.trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'?'; }
function esc(s) { return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(b) { return b<1024?b+' Б':b<1048576?(b/1024).toFixed(1)+' КБ':(b/1048576).toFixed(1)+' МБ'; }
function timeNow() { const d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function b64toBlob(b64,mime) { const c=atob(b64),a=new Array(c.length); for(let i=0;i<c.length;i++)a[i]=c.charCodeAt(i); return new Blob([new Uint8Array(a)],{type:mime}); }

// SIDEBAR
function toggleSidebar() {
    if (!isMobile) return;
    $('sidebar').classList.toggle('open');
    $('overlay').classList.toggle('active', $('sidebar').classList.contains('open'));
}
function closeSidebar() {
    $('sidebar').classList.remove('open');
    $('overlay').classList.remove('active');
}

function switchToGeneral() {
    currentChat = 'general';
    currentChatUser = null;
    $('chat-title').textContent = 'Общий чат';
    document.querySelectorAll('.chat-list-item').forEach(el => el.classList.remove('active'));
    document.querySelector('.chat-list-item').classList.add('active');
    chat.innerHTML = '';
    if (isMobile) closeSidebar();
}
function switchToPrivate(username) {
    currentChat = 'private';
    currentChatUser = username;
    $('chat-title').textContent = username;
    document.querySelectorAll('.chat-list-item').forEach(el => el.classList.remove('active'));
    const item = document.querySelector(`[data-user="${CSS.escape(username)}"]`);
    if (item) item.classList.add('active');
    chat.innerHTML = '';
    socket.emit('get_private_history', { username: myName, with: username });
    if (isMobile) closeSidebar();
}

// CONTEXT MENU
function showContextMenu(x, y, msgId, username, isPrivate, msgType) {
    if (username !== myName) return;
    contextMsgId = msgId;
    contextMsgUser = username;
    contextMsgIsPrivate = isPrivate || false;
    // «Изменить» только для текстовых
    $('menu-edit').style.display = (msgType === 'text') ? 'flex' : 'none';
    if (isMobile) {
        contextMenu.style.left = '50%';
        contextMenu.style.top = 'auto';
        contextMenu.style.bottom = '20px';
        contextMenu.style.transform = 'translateX(-50%)';
    } else {
        contextMenu.style.left = Math.min(x, window.innerWidth-180)+'px';
        contextMenu.style.top = Math.min(y, window.innerHeight-100)+'px';
        contextMenu.style.bottom = 'auto';
        contextMenu.style.transform = 'none';
    }
    contextMenu.classList.add('visible');
}
function hideContextMenu() { contextMenu.classList.remove('visible'); }
document.addEventListener('click', e => {
    if (!contextMenu.contains(e.target) && !e.target.classList.contains('msg-menu-btn')) {
        hideContextMenu();
    }
});

// EDIT / DELETE
function startEdit() {
    hideContextMenu();
    let el;
    if (contextMsgIsPrivate && currentChatUser) {
        el = privateMessageElements[currentChatUser]?.[contextMsgId];
    } else {
        el = messageElements[contextMsgId];
    }
    if (!el) return;
    const t = el.querySelector('.text');
    if (!t) return;
    editingMsgId = contextMsgId;
    textInput.value = t.textContent;
    textInput.focus();
    editBar.classList.add('active');
}
function cancelEdit() { editingMsgId = null; textInput.value = ''; editBar.classList.remove('active'); }
function deleteMsg() {
    hideContextMenu();
    if (contextMsgId) {
        socket.emit('delete_message', { msg_id: contextMsgId, username: myName, is_private: contextMsgIsPrivate });
    }
}

socket.on('message_edited', d => {
    const el = messageElements[d.id];
    if (el) {
        const t = el.querySelector('.text');
        if (t) t.textContent = d.text;
        if (!el.querySelector('.edited-label')) {
            const l = document.createElement('span');
            l.className = 'edited-label'; l.textContent = ' (изм.)';
            el.querySelector('.meta')?.before(l);
        }
    }
});
socket.on('private_message_edited', d => {
    const otherUser = d.from === myName ? d.to : d.from;
    const el = privateMessageElements[otherUser]?.[d.id];
    if (el) {
        const t = el.querySelector('.text');
        if (t) t.textContent = d.text;
        if (!el.querySelector('.edited-label')) {
            const l = document.createElement('span');
            l.className = 'edited-label'; l.textContent = ' (изм.)';
            el.querySelector('.meta')?.before(l);
        }
    }
});
socket.on('message_deleted', d => {
    const el = messageElements[d.id];
    if (el) {
        el.classList.add('deleting');
        setTimeout(() => { el.remove(); delete messageElements[d.id]; }, 300);
        return;
    }
    for (const user in privateMessageElements) {
        const pel = privateMessageElements[user][d.id];
        if (pel) {
            pel.classList.add('deleting');
            setTimeout(() => { pel.remove(); delete privateMessageElements[user][d.id]; }, 300);
            return;
        }
    }
});
socket.on('error_msg', d => addMsg('system', '', '⚠️ ' + d.message));

// MESSAGES
function addMsg(type, username, content, extra = {}, isPrivate = false) {
    const row = document.createElement('div');
    row.className = 'msg-row'; row.dataset.user = username;
    if (extra.id) row.dataset.msgId = extra.id;
    if (type === 'system') { row.classList.add('system'); row.innerHTML = `<div class="sys-msg">${esc(content)}</div>`; chat.appendChild(row); scrollDown(); return; }
    const isMy = username === myName;
    row.classList.add(isMy ? 'my' : 'other');
    const cont = lastSender === username && !isPrivate;
    if (cont) row.classList.add('continued');
    const av = document.createElement('div'); av.className = 'avatar lg';
    const uAv = userAvatars[username];
    if (uAv) av.innerHTML = `<img src="data:image/jpeg;base64,${uAv}">`;
    else { av.style.background = avatarColor(username); av.textContent = initials(username); }
    row.appendChild(av);
    const bubble = document.createElement('div'); bubble.className = 'bubble';
    if (!cont && !isMy) { const s = document.createElement('span'); s.className = 'sender'; s.style.color = avatarColor(username); s.textContent = username; bubble.appendChild(s); }
    if (type === 'text') {
        const t = document.createElement('div'); t.className = 'text'; t.textContent = content; bubble.appendChild(t);
        if (extra.edited) { const l = document.createElement('span'); l.className = 'edited-label'; l.textContent = ' (изм.)'; bubble.appendChild(l); }
    } else if (type === 'voice') {
        bubble.innerHTML += '<div class="text">🎤 <b>Голосовое</b></div>';
        const a = document.createElement('audio'); a.controls = true;
        a.src = URL.createObjectURL(content instanceof Blob ? content : b64toBlob(content, 'audio/webm'));
        bubble.appendChild(a);
    } else if (type === 'image') {
        const img = document.createElement('img');
        const url = URL.createObjectURL(content instanceof Blob ? content : b64toBlob(content, extra.mime||'image/jpeg'));
        img.src = url; img.onclick = () => { $('gallery-img').src = url; $('gallery').classList.add('active'); };
        bubble.appendChild(img);
    } else if (type === 'file') {
        bubble.innerHTML += `<div class="text">📎 <b>${esc(extra.filename)}</b> <small>(${fmtSize(extra.size)})</small></div>`;
        const a = document.createElement('a'); a.className = 'file-link';
        a.href = URL.createObjectURL(b64toBlob(content, extra.mime||'application/octet-stream'));
        a.download = extra.filename; a.textContent = '⬇ Скачать'; bubble.appendChild(a);
    }
    const meta = document.createElement('span'); meta.className = 'meta'; meta.textContent = timeNow(); bubble.appendChild(meta);
    
    const menuBtn = document.createElement('button');
    menuBtn.className = 'msg-menu-btn';
    menuBtn.textContent = '⋮';
    menuBtn.onclick = function(e) {
        e.stopPropagation();
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, extra.id, username, isPrivate, type);
    };
    row.appendChild(menuBtn);
    
    row.appendChild(bubble); chat.appendChild(row);
    if (extra.id) {
        if (isPrivate && currentChatUser) {
            if (!privateMessageElements[currentChatUser]) privateMessageElements[currentChatUser] = {};
            privateMessageElements[currentChatUser][extra.id] = row;
        } else {
            messageElements[extra.id] = row;
        }
    }
    lastSender = username; scrollDown();
    
    let pt;
    bubble.addEventListener('touchstart', e => { pt = setTimeout(() => { showContextMenu(0, 0, extra.id, username, isPrivate, type); navigator.vibrate?.(50); }, 500); }, {passive:true});
    bubble.addEventListener('touchend', () => clearTimeout(pt));
    bubble.addEventListener('touchmove', () => clearTimeout(pt));
    bubble.addEventListener('contextmenu', e => { e.preventDefault(); showContextMenu(e.clientX, e.clientY, extra.id, username, isPrivate, type); });
}
function scrollDown() { requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight); }

// SEND
function sendText() {
    const txt = textInput.value.trim(); if (!txt) return;
    if (editingMsgId) {
        socket.emit('edit_message', { msg_id: editingMsgId, text: txt, username: myName, is_private: currentChat === 'private' });
        cancelEdit();
    } else if (currentChat === 'private' && currentChatUser) {
        socket.emit('private_message', { username: myName, to: currentChatUser, text: txt });
    } else {
        socket.emit('text_message', { username: myName, text: txt });
    }
    textInput.value = ''; setTyping(false);
}
$('send-btn').onclick = sendText;
textInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } if (e.key === 'Escape' && editingMsgId) cancelEdit(); };
textInput.oninput = () => { if (textInput.value.trim() && !isTyping) setTyping(true); clearTimeout(typingTimer); typingTimer = setTimeout(() => setTyping(false), 2000); };
function setTyping(v) { if (v === isTyping) return; isTyping = v; socket.emit('typing', { username: myName, typing: v }); }

// IMAGES
function compressImage(file, maxDim) {
    return new Promise((res, rej) => {
        const img = new Image(); const url = URL.createObjectURL(file);
        img.onload = () => { URL.revokeObjectURL(url); let {width,height} = img;
            if (width > maxDim || height > maxDim) { const k = maxDim/Math.max(width,height); width=Math.round(width*k); height=Math.round(height*k); }
            const c = document.createElement('canvas'); c.width=width; c.height=height;
            c.getContext('2d').drawImage(img,0,0,width,height);
            const tryQ = q => c.toBlob(b => { if(!b) return c.toBlob(x=>res(x),'image/jpeg',0.3); if(b.size<=500*1024||q<=0.25) res(b); else tryQ(q-0.1); }, 'image/jpeg', q);
            tryQ(0.75); };
        img.onerror = rej; img.src = url;
    });
}
$('img-in').onchange = async () => {
    const files = Array.from($('img-in').files); $('img-in').value = '';
    for (const f of files) { if (f.size > 5*1024*1024) { alert('Макс. 5 МБ'); continue; }
        const blob = await compressImage(f, 1920); const buf = await blob.arrayBuffer();
        socket.emit('image_message', { username: myName, image: buf, mime: blob.type });
    }
};

// FILES
$('file-in').onchange = () => {
    const f = $('file-in').files[0]; $('file-in').value = '';
    if (!f || f.size > 10*1024*1024) { if(f) alert('Макс. 10 МБ'); return; }
    const r = new FileReader();
    r.onload = () => socket.emit('file_message', { username: myName, filename: f.name, file_data: r.result, mime: f.type||'application/octet-stream', size: f.size });
    r.readAsArrayBuffer(f);
};

// VOICE
recordBtn.onclick = async () => {
    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream); audioChunks = [];
            mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                stream.getTracks().forEach(t => t.stop());
                blob.arrayBuffer().then(buf => socket.emit('voice_message', { username: myName, audio: buf }));
            };
            mediaRecorder.start(); isRecording = true;
            recordBtn.classList.add('recording'); recordBtn.textContent = '⏹';
        } catch(e) { alert('Нет доступа к микрофону'); }
    } else {
        mediaRecorder?.stop(); isRecording = false;
        recordBtn.classList.remove('recording'); recordBtn.textContent = '🎤';
    }
};

// SOCKET EVENTS
socket.on('text_history', msgs => msgs.forEach(m => addMsg('text', m.username, m.text, { id: m.id, edited: m.edited })));
socket.on('text_message', d => { if (currentChat === 'general') addMsg('text', d.username, d.text, { id: d.id, edited: d.edited }); });
socket.on('voice_message', d => { if (currentChat === 'general') addMsg('voice', d.username, d.audio, { id: d.id }); });
socket.on('image_message', d => { if (currentChat === 'general') addMsg('image', d.username, d.image, { id: d.id, mime: d.mime }); });
socket.on('file_message', d => { if (currentChat === 'general') addMsg('file', d.username, d.file_data, { id: d.id, filename: d.filename, mime: d.mime, size: d.size }); });

socket.on('private_message', d => {
    const otherUser = d.from === myName ? d.to : d.from;
    if (currentChat === 'private' && currentChatUser === otherUser) {
        addMsg('text', d.from, d.text, { id: d.id, edited: d.edited }, true);
    }
});
socket.on('private_history', msgs => {
    msgs.forEach(m => {
        const sender = m.from === myName ? myName : m.from;
        addMsg('text', sender, m.text, { id: m.id, edited: m.edited }, true);
    });
});

socket.on('user_joined', d => { if (currentChat === 'general') addMsg('system', '', d.msg); });
socket.on('user_left', d => { if (currentChat === 'general') addMsg('system', '', d.msg); });
socket.on('update_user_list', users => {
    const el = $('chat-list');
    const existing = el.querySelectorAll('.chat-list-item[data-user]');
    existing.forEach(e => e.remove());
    const others = users.filter(u => u !== myName);
    others.forEach(u => {
        const item = document.createElement('div');
        item.className = 'chat-list-item';
        item.dataset.user = u;
        item.onclick = () => switchToPrivate(u);
        const av = document.createElement('div'); av.className = 'avatar';
        if (userAvatars[u]) av.innerHTML = `<img src="data:image/jpeg;base64,${userAvatars[u]}">`;
        else { av.style.background = avatarColor(u); av.textContent = initials(u); }
        const s = document.createElement('span'); s.textContent = u;
        item.appendChild(av); item.appendChild(s); el.appendChild(item);
    });
    socket.emit('get_user_avatars', { usernames: users });
});
socket.on('user_avatars', a => Object.assign(userAvatars, a));
socket.on('typing', d => {
    if (d.username === myName) return;
    if (currentChat === 'general' || (currentChat === 'private' && currentChatUser === d.username)) {
        $('status-bar').innerHTML = d.typing
            ? `<span class="typing-dots"><span></span><span></span><span></span></span> <span class="shimmer-text">${esc(d.username)} печатает...</span>` : '';
    }
});
socket.on('action_status', d => {
    if (d.username === myName) return;
    $('status-bar').innerHTML = d.action === 'recording' ? `<span class="shimmer-text">${esc(d.username)} записывает...</span>` : d.action === 'sending_file' ? `<span class="shimmer-text">${esc(d.username)} отправляет файл...</span>` : '';
});
</script>
</body>
</html>
